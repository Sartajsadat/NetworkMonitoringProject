# All environment-specific values come from environment variables.
# See ../.env.example for the full list and explanations.
spring:
  application:
    name: netmon-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/netmon}
    username: ${DB_USERNAME:netmon}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  # Trust X-Forwarded-* only from private-network proxies (nginx in docker compose).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}      # set to "ecs" or "logstash" for JSON logs in production
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

app:
  security:
    # REQUIRED: at least 32 random bytes, base64 encoded. Generate with: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:netmon}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:PT8H}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lockout-duration: ${LOCKOUT_DURATION:PT15M}
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:20}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    # Optional. If empty, a random one-time setup token is generated and printed to the
    # backend log on first start (only while no user exists).
    setup-token: ${BOOTSTRAP_SETUP_TOKEN:}
  monitoring:
    # A server counts as "online" if its agent reported within this window (Phase 2+).
    online-threshold: ${AGENT_ONLINE_THRESHOLD:PT2M}
    raw-retention: ${METRICS_RAW_RETENTION:P7D}
    rollup-retention: ${METRICS_ROLLUP_RETENTION:P90D}
  agents:
    enrollment-token-ttl: ${AGENT_ENROLLMENT_TOKEN_TTL:P1D}
    credential-grace-period: ${AGENT_CREDENTIAL_GRACE_PERIOD:PT10M}
    default-report-interval: ${AGENT_DEFAULT_REPORT_INTERVAL:30}
    # Address agents use to reach this platform, e.g. https://netmon.mot.gov.af (used in install commands).
    public-url: ${AGENT_PUBLIC_URL:}
