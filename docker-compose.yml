# Central platform: PostgreSQL + Spring Boot backend + nginx-served React frontend.
# Monitoring agents (Phase 2+) are installed separately on monitored servers, not here.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
#
name: netmon

# Container logs are rotated (Docker keeps at most 3 × 20 MB per service).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    environment:
      POSTGRES_DB: ${DB_NAME:-netmon}
      POSTGRES_USER: ${DB_USERNAME:-netmon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host. Uncomment only for local debugging:
    # ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    # Unprivileged process (see backend/Dockerfile); no Linux capabilities needed.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${BACKEND_MEMORY:-2g}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-netmon}
      DB_USERNAME: ${DB_USERNAME:-netmon}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-PT8H}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      BOOTSTRAP_SETUP_TOKEN: ${BOOTSTRAP_SETUP_TOKEN:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-}
      METRICS_RAW_RETENTION: ${METRICS_RAW_RETENTION:-P7D}
      METRICS_ROLLUP_RETENTION: ${METRICS_ROLLUP_RETENTION:-P90D}
      LOG_FORMAT: ${LOG_FORMAT:-}
      CAPTURE_STORAGE_QUOTA_BYTES: ${CAPTURE_STORAGE_QUOTA_BYTES:-10737418240}
      CAPTURE_MAX_DURATION_SECONDS: ${CAPTURE_MAX_DURATION_SECONDS:-3600}
      CAPTURE_MAX_BYTES: ${CAPTURE_MAX_BYTES:-1073741824}
      CAPTURE_DEFAULT_RETENTION_DAYS: ${CAPTURE_DEFAULT_RETENTION_DAYS:-7}
      CAPTURE_MAX_RETENTION_DAYS: ${CAPTURE_MAX_RETENTION_DAYS:-90}
      EVENTS_RETENTION: ${EVENTS_RETENTION:-P180D}
      EVENTS_MAX_PER_SERVER_PER_HOUR: ${EVENTS_MAX_PER_SERVER_PER_HOUR:-600}
      ALERT_EVALUATION_INTERVAL: ${ALERT_EVALUATION_INTERVAL:-PT1M}
      ALERTS_RESOLVED_RETENTION: ${ALERTS_RESOLVED_RETENTION:-P365D}
      FLOW_COLLECTOR_ENABLED: ${FLOW_COLLECTOR_ENABLED:-false}
      FLOW_MAX_PER_SECOND: ${FLOW_MAX_PER_SECOND:-20000}
      FLOWS_RETENTION: ${FLOWS_RETENTION:-P14D}
      FIREWALL_PROTECTED_CIDRS: ${FIREWALL_PROTECTED_CIDRS:-127.0.0.0/8,::1/128}
      FIREWALL_TASK_TIMEOUT: ${FIREWALL_TASK_TIMEOUT:-PT1H}
      TZ: UTC
    volumes:
      # Packet capture files (PCAPNG). Size is limited by CAPTURE_STORAGE_QUOTA_BYTES.
      - capture-data:/var/lib/netmon/captures
    # The API has no host port (reached through the frontend's reverse proxy). Only the flow
    # collector's UDP ports are published, on FLOW_BIND (set it to the management-network address).
    ports:
      - "${FLOW_BIND:-127.0.0.1}:${FLOW_NETFLOW_PORT:-2055}:2055/udp"
      - "${FLOW_BIND:-127.0.0.1}:${FLOW_IPFIX_PORT:-4739}:4739/udp"

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:8080"

volumes:
  db-data:
  capture-data:
