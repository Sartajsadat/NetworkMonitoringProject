# Serves the React build and reverse-proxies the API so browser, UI and API share one origin.

# Behind the TLS proxy (deploy/tls/netmon-tls.conf) the real client address and scheme arrive in
# X-Forwarded-For / X-Forwarded-Proto. They are trusted ONLY from loopback and the Docker bridge
# networks, so a client cannot fake its address by sending the header itself.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (TLS/HSTS are added at the TLS-terminating proxy; see docs).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Agents upload capture pieces (PCAPNG, at most 64 MB each). Larger body limit and no
    # buffering only here; every other request keeps the 2 MB limit above.
    location /api/v1/agent/captures/ {
        client_max_body_size 70m;
        proxy_request_buffering off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Capture downloads can be large: stream them instead of buffering on disk.
    location ~ ^/api/v1/captures/([0-9a-f-]+/)?download$ {
        proxy_pass http://backend:8080;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Only the health probe is exposed; other actuator endpoints stay internal.
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
    location /actuator/ {
        return 404;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths serve index.html, which must not be cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
