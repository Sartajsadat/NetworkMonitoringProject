# Drop-in for packet capture: /etc/systemd/system/netmon-agent.service.d/capture.conf
# Installed only by deploy/linux/enable-capture.sh. Without it the agent cannot capture packets.
#
# The agent's Java process still gets NO capabilities (AmbientCapabilities stays empty). Only the
# dumpcap program, which has the file capabilities cap_net_raw,cap_net_admin and is executable only
# by the "wireshark" group, can open interfaces. For that the service must:
#   - allow file capabilities to take effect when dumpcap starts (NoNewPrivileges=no),
#   - keep those two capabilities in the bounding set,
#   - be in the wireshark group, and be allowed to open AF_PACKET sockets.
[Service]
NoNewPrivileges=no
CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN
AmbientCapabilities=
SupplementaryGroups=wireshark
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK AF_PACKET
