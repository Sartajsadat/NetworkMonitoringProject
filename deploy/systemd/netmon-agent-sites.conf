# Drop-in for website blocking: /etc/systemd/system/netmon-agent.service.d/sites.conf
# Installed only by deploy/linux/enable-sites.sh. The agent runs exactly
# "sudo -n /usr/lib/netmon-agent/netmon-hosts <site>..." (sudoers file /etc/sudoers.d/netmon-agent-sites);
# the root-owned helper validates every name and rewrites only NetMon's section of /etc/hosts.
[Service]
NoNewPrivileges=no
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
ReadWritePaths=/etc/hosts /run
RestrictSUIDSGID=no
