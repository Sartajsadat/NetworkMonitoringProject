# Drop-in for firewall control: /etc/systemd/system/netmon-agent.service.d/firewall.conf
# Installed only by deploy/linux/enable-firewall.sh. Without it the agent cannot change the firewall.
#
# The agent's Java process still gets NO capabilities (AmbientCapabilities stays empty).
#  - nftables: only the agent's private copy of nft (/usr/lib/netmon-agent/nft, executable only by
#    the "netmon-fw" group) carries the file capability cap_net_admin.
#  - UFW: the agent runs exactly "sudo -n /usr/sbin/ufw ..." (sudoers file /etc/sudoers.d/netmon-agent);
#    see the UFW section added by enable-firewall.sh --backend ufw.
[Service]
NoNewPrivileges=no
CapabilityBoundingSet=CAP_NET_ADMIN
SupplementaryGroups=netmon-fw
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
