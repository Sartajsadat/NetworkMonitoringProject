# TLS front end for NetMon (host nginx). Users and agents connect here on 443; it forwards to the
# NetMon frontend container, which Docker Compose publishes on 127.0.0.1:8088 (HTTP_BIND/HTTP_PORT).
#
#   sudo apt install nginx
#   sudo cp deploy/tls/netmon-tls.conf /etc/nginx/sites-available/netmon && sudo ln -s ../sites-available/netmon /etc/nginx/sites-enabled/
#   (edit server_name and the certificate paths)  sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: use the ministry's CA (agents then need --ca ministry-ca.pem) or a public CA.
# The certificate must name the host agents and browsers use (subjectAltName).

server {
    listen 80;
    listen [::]:80;
    server_name netmon.example.gov.af;
    # Plain HTTP only redirects; nothing is served without TLS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name netmon.example.gov.af;

    ssl_certificate     /etc/netmon/tls/netmon.crt;   # server certificate + intermediates
    ssl_certificate_key /etc/netmon/tls/netmon.key;   # chmod 600, owned by root
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NetMonTLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security;   # the backend may send its own; keep one

    # Capture pieces from agents can be up to 64 MB (see frontend/nginx.conf).
    client_max_body_size 70m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so a client cannot inject its own address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
